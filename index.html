<title>SC Futsal Season 2</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1b2e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC Futsal"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 2 43 9v14c0 12-8 20-19 23C13 43 5 35 5 23V9z' fill='%230b1428' stroke='%232dff8f' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='11' fill='%23fff'/%3E%3Cpath d='M24 17.5l5 3.6-1.9 5.9h-6.2L19 21.1z' fill='%23111'/%3E%3C/svg%3E">
<style>
:root{--bg:#070b14;--card:#0f1626;--card2:#16203a;--ac:#2dff8f;--ac2:#00c6ff;--tx:#e8eefc;--mut:#8a97b8;--gold:#ffd24a;--red:#ff5d6c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}button,.chip{touch-action:manipulation}
body{background:radial-gradient(1000px 500px at 15% -10%,#12305a66,transparent),radial-gradient(800px 500px at 100% 0,#2dff8f22,transparent),var(--bg);color:var(--tx);font:17px/1.4 'Times New Roman',Times,serif;min-height:100vh;overflow-x:hidden}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;position:sticky;top:0;z-index:10;background:#070b14;border-bottom:1px solid #ffffff12}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.ball{display:inline-block;animation:bounce 1.4s infinite}
nav{display:flex;gap:6px;margin-left:auto;background:var(--card);padding:4px;border-radius:14px;position:relative}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;transition:.25s}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04101a;box-shadow:0 4px 18px #2dff8f55}
.adm-b{background:var(--card2);border:1px solid #ffffff18;color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:linear-gradient(160deg,var(--card),#0b1120);border:1px solid #ffffff10;border-radius:20px;padding:18px;margin-bottom:16px}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-20deg)}70%{transform:translate(-50%,-50%) scale(1.15)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) rotate(180deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffd24a88}50%{box-shadow:0 0 0 14px #ffd24a00}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes spark{0%{transform:translateY(0) scale(0);opacity:0}30%{opacity:1;transform:scale(1)}100%{transform:translateY(-70px) scale(.4);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.dir1{animation:slideR .35s both}.dir-1{animation:slideL .35s both}
.mdbar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.mdbar h2{font-size:22px;min-width:190px;text-align:center}
.mdbar small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff20;background:var(--card2);color:var(--ac);font-size:20px;cursor:pointer;transition:.2s}
.arr:hover:not(:disabled){transform:scale(1.15);background:var(--ac);color:#04101a}.arr:disabled{opacity:.25;cursor:default}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:99px;background:var(--card2);border:1px solid #ffffff14;color:var(--mut);cursor:pointer;font-size:13px;transition:.2s}
.chip.on{background:var(--ac);color:#04101a;font-weight:700}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .tn{font-weight:700;margin-top:6px}
.lg{width:72px;height:72px;border-radius:50%;object-fit:contain;flex:none;aspect-ratio:1;background:var(--card2);border:2px solid #ffffff22;transition:.3s}
.lg:hover{transform:rotate(360deg) scale(1.1)}
.ph{display:inline-grid;place-items:center;font-size:28px;font-weight:800;color:var(--ac)}
.sm{width:30px;height:30px;font-size:14px}
.big{font-size:56px;font-weight:900;background:linear-gradient(135deg,#fff,var(--ac));-webkit-background-clip:text;color:transparent;display:flex;gap:10px;align-items:center;justify-content:center;text-shadow:0 0 40px #2dff8f55}
.big span.d{color:var(--mut);font-size:36px;-webkit-text-fill-color:var(--mut)}
.motm{padding-top:28px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.crown{position:relative;width:84px;height:84px;flex:none}
.crown:before{content:"";position:absolute;top:-5px;left:-5px;right:-5px;bottom:-5px;border-radius:50%;background:conic-gradient(var(--gold),var(--ac),var(--ac2),var(--gold));animation:spin 3s linear infinite}
.crown div{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:28px;font-weight:800}
.crown em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:24px;animation:bounce 1.6s infinite}
.tag{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700}
.motm h3{font-size:22px}
.spk{position:absolute;font-size:14px;animation:spark 2.6s infinite;opacity:0}
.badge{display:inline-flex;gap:4px;align-items:center;background:var(--card2);padding:4px 9px;border-radius:99px;font-size:13px;margin:3px 4px 0 0}
.rtg{background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#1a1000;font-weight:800;padding:2px 9px;border-radius:8px}
h4{margin-bottom:10px;color:var(--mut);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.contrib{display:flex;flex-wrap:wrap;gap:8px}
.pitch-wrap{display:flex;justify-content:center}
.pitch{position:relative;width:100%;max-width:1000px;aspect-ratio:5/8;container-type:inline-size;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(0deg,#127a3e 0 10%,#0f6b36 10% 20%);border:3px solid #ffffff55;box-shadow:inset 0 0 60px #00000066,0 20px 50px #00000066}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff66}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;border:2px solid #ffffff66;border-radius:50%;transform:translate(-50%,-50%)}
.box{position:absolute;left:25%;width:50%;height:15%;border:2px solid #ffffff66}.box.t{top:0;border-top:0}.box.b{bottom:0;border-bottom:0}
.pn{position:absolute;transform:translate(-50%,-50%);text-align:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*110ms + 200ms);width:74px;width:max(64px,22cqw);z-index:2}
.pn .av{position:relative;width:46px;height:46px;width:clamp(32px,10.5cqw,72px);height:clamp(32px,10.5cqw,72px);font-size:clamp(11px,3.4cqw,24px);border-radius:50%;margin:auto;background:linear-gradient(135deg,#1c2b4d,#0b1428);border:2px solid #fff;display:grid;place-items:center;font-weight:800;box-shadow:0 6px 16px #0008;transition:.25s;cursor:pointer}
.pn:hover .av{transform:scale(1.2) translateY(-4px)}
.pn.mv .av{border-color:var(--gold);box-shadow:0 0 16px #ffd24acc}
.rt{position:absolute;top:-8px;right:-12px;font-size:11px;font-size:clamp(10px,3cqw,17px);padding:1px 6px;border-radius:8px;color:#04101a;font-weight:800}
.r-g{background:var(--ac)}.r-y{background:var(--gold)}.r-r{background:var(--red)}
.ev{display:flex;justify-content:center;flex-wrap:nowrap;white-space:nowrap;gap:2px;margin-top:2px;font-size:11px;font-size:clamp(10px,3cqw,18px);min-height:13px;text-shadow:0 1px 3px #000}
.nm{display:block;font-size:11px;font-size:clamp(11px,3.2cqw,19px);font-weight:700;font-weight:700;text-shadow:0 1px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs{margin-top:12px;color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--mut);letter-spacing:1px;text-align:center;padding:8px 4px;text-transform:uppercase}
td{padding:10px 4px;text-align:center;border-top:1px solid #ffffff0d}
td:nth-child(2),th:nth-child(2){text-align:left}
tbody tr{animation:rise .5s both;animation-delay:calc(var(--i)*60ms);transition:.2s}tbody tr:hover{background:#ffffff0a}
td.pt{font-weight:900;color:var(--ac)}
.tm{display:flex;align-items:center;gap:8px}
.pos1 td:first-child{color:var(--gold);font-weight:900}
.hero{display:flex;gap:16px;align-items:center}
.bar{transform-origin:left;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:grow 1s .3s both}
.lb{display:grid;grid-template-columns:26px 1fr 40px;gap:8px;align-items:center;margin:8px 0;animation:rise .5s both;animation-delay:calc(var(--i)*70ms)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.big{font-size:44px}nav button{padding:8px 10px}.lg{width:56px;height:56px}}
.empty{text-align:center;padding:60px;color:var(--mut)}
.sk{height:120px;border-radius:20px;margin-bottom:16px;background:linear-gradient(90deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:200% 100%;animation:shine 1.3s infinite}

body{padding-bottom:env(safe-area-inset-bottom)}
header{flex-wrap:wrap}
.dash{display:grid;gap:0 16px;grid-template-columns:minmax(0,1fr)}
.big{font-size:clamp(36px,11vw,64px)}
.lg:not(.sm){width:clamp(50px,14vw,76px);height:clamp(50px,14vw,76px)}
.mc .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:10px}
.mc .tn{font-size:clamp(13px,3.6vw,16px)}
.sc-l{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;font-size:clamp(11px,3vw,13px);border-top:1px solid #ffffff10;padding-top:10px}
.sc-l>div:last-child{text-align:right}
.sc-l small{display:block;color:var(--mut)}
.tbar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0006;z-index:3;font-size:clamp(11px,3vw,14px)}
.tbar.t{top:0}.tbar.b{bottom:0}.tbar span{margin-left:auto;color:#ffffffcc}
.tbar .lg{width:22px!important;height:22px!important;font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{min-width:420px}
.sr{margin:12px 0}.sn{text-align:center;color:var(--mut);font-size:12px;margin-bottom:4px}
.sbw{display:flex;align-items:center;gap:8px}.sbw b{width:34px;text-align:center}
.sb{flex:1;height:8px;border-radius:9px;background:var(--card2);overflow:hidden}
.sb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:grow 1s .2s both;transform-origin:left}
.sb.l i{margin-left:auto;transform-origin:right}
.sh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
@media(max-width:560px){header{padding:10px 12px}nav{order:3;width:100%;margin:0}nav button{flex:1;padding:9px 4px}.logo{flex:1}.arr{width:40px;height:40px}.mdbar{gap:8px}.mdbar h2{min-width:0;flex:1;font-size:18px}main{padding:12px}.card{padding:14px;border-radius:16px}.modal{padding:10px}.panel{padding:12px}}
@media(min-width:960px){.dash{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);align-items:start}main{max-width:1320px}}

body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,#070b14e0,#070b14a6 45%,#070b14ee),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' preserveAspectRatio='xMidYMid slice'><g fill='none' stroke='%23ffffff' stroke-opacity='.16' stroke-width='3'><rect x='40' y='40' width='1120' height='720'/><path d='M600 40V760'/><circle cx='600' cy='400' r='95'/><rect x='40' y='230' width='170' height='340'/><rect x='990' y='230' width='170' height='340'/><rect x='40' y='320' width='70' height='160'/><rect x='1090' y='320' width='70' height='160'/></g><circle cx='600' cy='400' r='6' fill='%23fff' fill-opacity='.2'/></svg>") center/cover no-repeat,repeating-linear-gradient(90deg,#0e5230 0 90px,#0a4126 90px 180px)}
body::after{content:"";position:fixed;right:-90px;bottom:-90px;width:340px;height:340px;z-index:-1;pointer-events:none;opacity:.13;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23fff'/><g fill='%23111'><path d='M50 30l17 12-6 20H39l-6-20z'/><path d='M50 4l12 9-4 13H42l-4-13zM94 40l-4 14-12 3-5-12 12-12zM6 40l12 4 12 12-5 12-12-3-4-14zM28 90l-2-13 12-6 8 10-4 11zM72 90l-14 0-4-11 8-10 12 6z'/></g></svg>") center/contain no-repeat;animation:spin 70s linear infinite}
button,input,select{font-family:inherit}
h1,h2,h3,h4,.logo,.tag,.big,th,.sh,.wtag{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
.lgo{flex:none;filter:drop-shadow(0 3px 10px #2dff8f66);transition:.4s}.logo:hover .lgo{transform:rotate(-8deg) scale(1.12)}
.logo .t{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;font-style:italic;font-weight:900;letter-spacing:1.5px;background:linear-gradient(90deg,#fff,var(--ac));-webkit-background-clip:text;color:transparent}
.mc{position:relative;overflow:hidden}
.win{position:relative}
.win .lg{border-color:var(--gold);box-shadow:0 0 0 4px #ffd24a44,0 0 30px #ffd24acc;animation:cheer 1.1s ease-in-out infinite}
.win .tn{color:var(--gold)}
.trophy{display:block;font-size:30px;animation:bounce 1s infinite;margin-bottom:2px}
.wtag{display:inline-block;margin-top:4px;background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#1a1000;font-weight:900;font-size:11px;letter-spacing:2px;padding:2px 10px;border-radius:99px;animation:pulse 1.4s infinite}
@keyframes cheer{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.confetti{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:2}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall 3.2s linear 3 both}
.confetti u{position:absolute;bottom:-20px;font-size:22px;text-decoration:none;opacity:0;animation:rise2 3.4s ease-out 2 both}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(440px) rotate(720deg)}}
@keyframes rise2{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-300px) scale(1.4) rotate(40deg)}}
.pitch{box-shadow:inset 0 0 80px #00000066,0 24px 60px #000000aa}
.pn .av{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
.rt{font-family:'Times New Roman',Times,serif}
.pname{align-self:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 2px}
.sc{font-size:28px;font-weight:900;min-width:36px;text-align:center;color:var(--ac);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
.srch{display:flex;gap:6px;margin:8px 0 4px}.srch input{flex:1;min-width:0}

.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 18px 0;max-width:1320px;margin:0 auto}
.tl{justify-self:start;display:flex}.tr{justify-self:end}
.ttl{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;font-style:italic;font-weight:900;text-align:center;text-transform:uppercase;font-size:clamp(19px,5vw,42px);letter-spacing:1.5px;line-height:1.1;background:linear-gradient(90deg,#fff,var(--ac),#fff,var(--ac2),#fff);background-size:250% 100%;-webkit-background-clip:text;color:transparent;animation:tshine 7s linear infinite;filter:drop-shadow(0 3px 12px #2dff8f55)}
@keyframes tshine{to{background-position:-250% 0}}
.scene{max-width:640px;margin:0 auto;padding:0 12px}.scene svg{width:100%;height:auto;display:block;overflow:visible}
.tabs{position:sticky;top:8px;z-index:10;margin:6px auto 6px;width:max-content;max-width:calc(100% - 20px);box-shadow:0 8px 24px #000a}
.pl{animation:plr 6s linear infinite}
.leg{animation:lsw .42s ease-in-out infinite alternate}.l2{animation-direction:alternate-reverse}
.l1{transform-origin:-3px 86px}.l2{transform-origin:3px 86px}
.kick{transform-origin:-3px 86px;animation:kk 6s linear infinite}
.arm{animation:asw .42s ease-in-out infinite alternate}.a1{transform-origin:-9px 62px}.a2{transform-origin:9px 62px;animation-direction:alternate-reverse}
.bx{animation:bxx 6s linear infinite}.by{animation:byy 6s linear infinite}.bs{animation:spin .5s linear infinite;transform-origin:0 0}
.gl{opacity:0;animation:gll 6s linear infinite}
.net{animation:nt 6s linear infinite;transform-origin:524px 90px}
@keyframes plr{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}38%{transform:translate(200px,0)}60%{transform:translate(200px,0)}64%{transform:translate(200px,-16px)}68%{transform:translate(200px,0)}72%{transform:translate(200px,-16px)}76%{transform:translate(200px,0)}94%{opacity:1;transform:translate(200px,0)}100%{opacity:0;transform:translate(200px,0)}}
@keyframes lsw{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes asw{from{transform:rotate(34deg)}to{transform:rotate(-34deg)}}
@keyframes kk{0%,31%{transform:rotate(0)}34%{transform:rotate(60deg)}38%{transform:rotate(-75deg)}46%,100%{transform:rotate(0)}}
@keyframes bxx{0%{opacity:0;transform:translateX(0)}3%{opacity:1}38%{transform:translateX(184px);animation-timing-function:cubic-bezier(.25,.7,.35,1)}58%{transform:translateX(445px)}62%{transform:translateX(452px)}68%{transform:translateX(445px)}94%{opacity:1;transform:translateX(445px)}100%{opacity:0;transform:translateX(445px)}}
@keyframes byy{0%,38%{transform:translateY(0);animation-timing-function:cubic-bezier(.3,.6,.5,1)}49%{transform:translateY(-52px);animation-timing-function:cubic-bezier(.5,0,.8,.5)}58%{transform:translateY(-14px)}63%{transform:translateY(0)}65%{transform:translateY(-6px)}67%,100%{transform:translateY(0)}}
@keyframes nt{0%,57%{transform:scale(1,1)}60%{transform:scale(1.08,1.04)}68%,100%{transform:scale(1,1)}}
@keyframes gll{0%,56%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.35)}64%{transform:scale(1)}90%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}}
@media(max-width:560px){.adm-b .at{display:none}.top{padding:10px 12px 0}.lgo{width:32px;height:32px}}
/* admin */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#000b;display:none;place-items:start center;overflow:auto;z-index:50;padding:20px}
.modal.on{display:grid}
.panel{background:var(--card);border:1px solid #ffffff18;border-radius:20px;padding:18px;width:100%;max-width:760px;animation:rise .4s both}
.panel input,.panel select{background:var(--card2);border:1px solid #ffffff18;color:var(--tx);border-radius:10px;padding:9px;font:inherit;max-width:100%}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#04101a;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:var(--red);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-top:1px solid #ffffff0d}.li b{flex:1}
.lrow{display:grid;grid-template-columns:2fr 1fr repeat(6,.75fr) auto;gap:4px;margin:6px 0;align-items:end}.f{display:flex;flex-direction:column;font-size:10px;color:var(--mut);min-width:0}
.lrow input,.lrow select{padding:6px!important;width:100%;min-width:0}
.lh{display:grid;grid-template-columns:1.6fr .9fr repeat(5,.55fr) 30px;gap:4px;font-size:10px;color:var(--mut)}

function hasXY(l){return l.x!==''&&l.x!=null&&l.y!==''&&l.y!=null}
function half(L,t,top,mv,o){
  const on=L.filter(l=>S(l.teamId)===S(t.id)),seen={},isS=l=>l.pos==='SUB'||(!hasXY(l)&&!POS[l.pos]);
  const ps=on.filter(l=>!isS(l)).map((l,i)=>{
    let x,y;
    if(hasXY(l)){x=top?100-N(l.x):N(l.x);y=top?50-N(l.y)*.45:50+N(l.y)*.45}
    else{const k=seen[l.pos]=(seen[l.pos]==null?-1:seen[l.pos])+1;x=POS[l.pos][0];if(k)x+=(k%2?1:-1)*Math.ceil(k/2)*15;const y0=YA[ROW[l.pos]];y=top?y0:100-y0}
    const r=N(l.rating);
    return `<div class="pn ${mv===l?'mv':''}" style="left:${x}%;top:${y}%;--i:${o+i}"><div class="av">${l.jersey?esc(l.jersey):ini(pn(l.playerId))}<b class="rt ${rc(r)}">${r}</b></div><div class="ev">${ev(l)}</div><span class="nm">${esc(pn(l.playerId))}</span></div>`}).join('');
